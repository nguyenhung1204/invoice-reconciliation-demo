<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đổi mật khẩu · AutoInvoice</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1220; color: #e5edf7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #25354b; border-radius: 16px; background: #111c2e; box-shadow: 0 20px 70px #0005; }
    h1 { margin: 0 0 8px; font-size: 24px; } p { color: #9fb0c5; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; color: #c8d5e5; font-size: 14px; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #344760; border-radius: 9px; background: #0b1422; color: inherit; font: inherit; }
    input:focus { outline: 2px solid #36b88a; border-color: transparent; }
    button, a.back { display: inline-block; margin-top: 22px; padding: 11px 15px; border: 0; border-radius: 9px; background: #15966e; color: white; font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; } a.back { margin-left: 8px; background: #26364b; }
    #message { min-height: 24px; margin: 15px 0 0; } #message.error { color: #ff9b9b; } #message.success { color: #61d6a8; }
  </style>
</head>
<body>
  <main>
    <h1>Đổi mật khẩu</h1>
    <p>Mật khẩu mới cần có ít nhất 8 ký tự.</p>
    <form id="password-form">
      <label for="old-password">Mật khẩu hiện tại</label>
      <input id="old-password" name="old_password" type="password" autocomplete="current-password" required>
      <label for="new-password">Mật khẩu mới</label>
      <input id="new-password" name="new_password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm-password">Nhập lại mật khẩu mới</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
      <button id="submit" type="submit">Cập nhật mật khẩu</button>
      <a class="back" href="/">Quay lại</a>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.querySelector('#password-form');
    const message = document.querySelector('#message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const oldPassword = form.elements.old_password.value;
      const newPassword = form.elements.new_password.value;
      if (newPassword !== document.querySelector('#confirm-password').value) {
        message.textContent = 'Mật khẩu nhập lại không khớp.';
        message.className = 'error';
        return;
      }
      const token = localStorage.getItem('autoinvoice_token');
      if (!token) {
        message.textContent = 'Không tìm thấy phiên đăng nhập. Vui lòng đăng nhập lại.';
        message.className = 'error';
        return;
      }
      const button = document.querySelector('#submit');
      button.disabled = true;
      message.textContent = 'Đang cập nhật…';
      message.className = '';
      try {
        const response = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Không thể đổi mật khẩu.');
        message.textContent = result.message || 'Đổi mật khẩu thành công.';
        message.className = 'success';
        form.reset();
      } catch (error) {
        message.textContent = error.message || 'Không kết nối được máy chủ.';
        message.className = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
